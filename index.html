<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3EDE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17120F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ROLL CREDITS — things i swear i'll watch eventually. A personal cinema archive for movies and shows." />
    <link rel="canonical" href="https://roll-credits-titles.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <title>ROLL CREDITS</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roll Credits" />
    <meta property="og:title" content="Roll Credits" />
    <meta
      property="og:description"
      content="A personal cinema archive for movies and shows — track your watchlist, log ratings and notes, and let Roll Credits pick tonight's screening for you."
    />
    <meta property="og:url" content="https://roll-credits-titles.vercel.app/" />
    <meta property="og:image" content="https://roll-credits-titles.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roll Credits" />
    <meta
      name="twitter:description"
      content="A personal cinema archive for movies and shows — track your watchlist, log ratings and notes, and let Roll Credits pick tonight's screening for you."
    />
    <meta name="twitter:image" content="https://roll-credits-titles.vercel.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Roll Credits",
        "url": "https://roll-credits-titles.vercel.app/",
        "description": "A personal cinema archive for movies and shows — track your watchlist, log ratings and notes, and let Roll Credits pick tonight's screening for you."
      }
    </script>

    <script>
      (function () {
        try {
          var pref = localStorage.getItem('rollcredits.theme');
          if (pref === 'light' || pref === 'dark') {
            document.documentElement.classList.add(pref);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
